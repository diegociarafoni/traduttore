name: Install scanners
description: Trivy, Gitleaks e OSV-Scanner da binari ufficiali con checksum verificato.
runs:
  using: composite
  steps:
    - shell: bash
      run: |
        set -euo pipefail
        dir="$RUNNER_TEMP/scanners"
        mkdir -p "$dir"
        cd "$dir"
        fetch() { curl -fsSL --retry 3 -o "$2" "$1"; echo "$3  $2" | sha256sum -c -; }
        fetch https://github.com/aquasecurity/trivy/releases/download/v0.74.0/trivy_0.74.0_Linux-64bit.tar.gz \
          trivy.tar.gz 2ae6fe3ee734b7fdf11335663e18c75ea12dccc76062f09f164a3b0f8be4371a
        fetch https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
          gitleaks.tar.gz 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        fetch https://github.com/google/osv-scanner/releases/download/v2.6.0/osv-scanner_linux_amd64 \
          osv-scanner ca69b3d3cd08f889a49dc0a383122f71cc528b83803671df5fd874d97485b108
        tar xzf trivy.tar.gz trivy
        tar xzf gitleaks.tar.gz gitleaks
        sudo install -m 0755 trivy gitleaks osv-scanner /usr/local/bin/
