name: Pubblicazione

# Pubblica il proxy di traduzione su Cloudflare Workers e il sito statico su GitHub Pages a ogni modifica di main.
on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', '**/*.md', 'LICENSE']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  worker:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      url: ${{ steps.deploy.outputs.deployment-url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verifica dei segreti
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
          DEEPL_KEY: ${{ secrets.DEEPL_KEY || vars.DEEPL_KEY }}
          PASSWORD: ${{ secrets.PASSWORD || vars.PASSWORD }}
        run: |
          missing=0
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID DEEPL_KEY PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Segreto $name mancante: vedi docs/pubblicazione.md"
              missing=1
            fi
          done
          exit "$missing"
      - id: deploy
        uses: cloudflare/wrangler-action@2ef9f398b9175c68f953e40d679493850d640a85 # v4.1.3
        env:
          DEEPL_KEY: ${{ secrets.DEEPL_KEY || vars.DEEPL_KEY }}
          PASSWORD: ${{ secrets.PASSWORD || vars.PASSWORD }}
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: 4.147.0
          workingDirectory: worker
          command: deploy
          secrets: |
            DEEPL_KEY
            PASSWORD

  build:
    needs: worker
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - run: npm ci --no-audit --no-fund
      - run: npm run build
        env:
          VITE_API_URL: ${{ needs.worker.outputs.url }}
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
