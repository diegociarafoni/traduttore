name: Scorecard

# Valutazione delle pratiche di sicurezza del repository (OpenSSF Scorecard):
# ogni lunedì e a ogni modifica delle regole di protezione di main. Il risultato è
# pubblico nel badge e nella scheda Code scanning; non blocca nessuna PR.
on:
  branch_protection_rule:
  schedule:
    - cron: '41 5 * * 1'
  workflow_dispatch:

permissions: read-all

jobs:
  analisi:
    # La pubblicazione del risultato è ammessa solo dal ramo predefinito.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      # Per il caricamento nel code scanning e la pubblicazione firmata del risultato.
      security-events: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: scorecard.sarif
          results_format: sarif
          publish_results: true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scorecard
          path: scorecard.sarif
          retention-days: 30
      - name: Caricamento SARIF nel code scanning
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          sarif_file: scorecard.sarif
