name: CI

on:
  pull_request:
  push:
    branches: [main]
  merge_group:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - run: npm ci --no-audit --no-fund
      - name: Formattazione
        run: npm run format:check
      - name: Analisi statica
        run: npm run lint
      - name: Documentazione, commenti, testi e licenze
        run: npm run check:conventions
      - name: Unit test e copertura della logica
        run: npm run test:coverage
      - name: Build
        run: npm run build
        env:
          VITE_API_URL: https://proxy.traduttore.test
      - name: Dimensioni del sito
        run: node tool/check-bundle.mjs

  e2e:
    name: e2e
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - run: npm ci --no-audit --no-fund
      - name: Chromium di Playwright
        run: npx playwright install --with-deps chromium
      - name: Test end-to-end, accessibilità e schermate di riferimento
        run: npm run test:e2e
      # Copia nel log delle schermate diverse dai riferimenti, per aggiornarli anche senza scaricare l'artefatto.
      - name: Schermate diverse dai riferimenti
        if: failure()
        run: |
          find test-results -name '*-actual.png' | sort | while read -r f; do
            echo "SCHERMATA $f"
            base64 -w0 "$f"
            echo
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
