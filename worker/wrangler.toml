name = "traduttore"
main = "src/index.js"
compatibility_date = "2026-09-01"
workers_dev = true

[vars]
ALLOWED_ORIGINS = "https://diegociarafoni.github.io"
# Per tradurre con un modello Claude diverso da quello predefinito (CLAUDE_MODEL in src/index.js):
# CLAUDE_MODEL = "claude-sonnet-5-5"

# Al massimo 100 richieste al minuto per indirizzo IP.
[[ratelimits]]
name = "LIMITATORE"
namespace_id = "1001"
simple = { limit = 100, period = 60 }

[observability]
enabled = false
