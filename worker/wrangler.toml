name = "traduttore"
main = "src/index.js"
compatibility_date = "2026-09-01"
workers_dev = true

[vars]
ALLOWED_ORIGINS = "https://diegociarafoni.github.io"
# Modello usato quando si traduce con Claude.
CLAUDE_MODEL = "claude-opus-5-5"

# Al massimo 100 richieste al minuto per indirizzo IP.
[[ratelimits]]
name = "LIMITATORE"
namespace_id = "1001"
simple = { limit = 100, period = 60 }

[observability]
enabled = false
